name: pages

# Publishes the static UI from frontend/ to GitHub Pages.
# Pages is served with build_type "workflow", so no Jekyll processing happens
# and a .nojekyll file is not needed.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run frontend tests
        # The tariff rules are duplicated in the browser on purpose; this keeps
        # the copy honest against backend/pricing.py.
        run: node --test tests/

  deploy:
    name: deploy to Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
