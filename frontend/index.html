<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tg-digest</title>
    <meta name="description" content="Дайджесты из Telegram-каналов через DeepSeek" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./assets/theme.css" />
    <script>
      // Resolve the theme before the first paint, so the page never flashes the wrong
      // colours. The stored value is the user's choice: "system" | "light" | "dark".
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("tg-digest.theme") || "system";
        } catch (error) {
          theme = "system";
        }
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = theme === "dark" || (theme !== "light" && prefersDark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">tg</span>
        <span class="brand__name">tg-digest</span>
      </div>
      <button id="theme-toggle" class="ghost-button" type="button">Тема: системная</button>
    </header>

    <main class="shell">
      <!-- No token yet: introduce the project and ask for the GitHub token. -->
      <section id="view-welcome" class="view" hidden></section>

      <!-- Token stored: ask for the PIN that decrypts it. -->
      <section id="view-lock" class="view" hidden></section>

      <!-- The setup wizard. -->
      <section id="view-wizard" class="view" hidden></section>

      <!-- Everything configured. -->
      <section id="view-app" class="view" hidden></section>
    </main>

    <footer class="footer">
      <span id="tariff" class="footer__tariff">определяем тариф…</span>
      <span id="footer-tokens" class="footer__figure">Токенов: 0</span>
      <span id="footer-cost" class="footer__figure">Стоимость: $0.0000</span>
      <span id="footer-budget" class="footer__figure">Бюджет: $5.0000/мес</span>
      <span class="footer__muted">модель: <span id="footer-model">deepseek-flash</span></span>
    </footer>

    <!-- Vendored UMD library: it must be a classic script, so it lands on window.nacl. -->
    <script src="./vendor/tweetnacl.js"></script>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
