<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>tg-digest</title>
    <meta name="description" content="Дайджесты из Telegram-каналов через DeepSeek" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./assets/design.css" />
    <script>
      // Resolve the theme before the first paint, so the page never flashes the wrong
      // colours. The stored value is the user's choice: "system" | "light" | "dark".
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("tg-digest.theme") || "system";
        } catch (error) {
          theme = "system";
        }
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = theme === "dark" || (theme !== "light" && prefersDark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <!-- The header, the navigation and the cost strip all appear only once the app itself
         does: on the PIN screen and during onboarding there is nothing to navigate to. -->
    <header class="appbar" id="appbar" hidden>
      <button
        class="btn btn--quiet btn--round"
        id="nav-back"
        type="button"
        aria-label="Назад"
        hidden
      ></button>
      <h1 class="appbar__title" id="appbar-title">Дайджесты</h1>
      <button class="btn btn--quiet btn--round" id="theme-toggle" type="button"></button>
    </header>

    <main class="app" id="views">
      <noscript>
        <section class="screen screen--narrow">
          <div class="card">
            <h1>Нужен JavaScript</h1>
            <p class="muted">
              Приложение целиком работает в браузере: оно обращается к GitHub API по вашему
              токену. Без JavaScript интерфейс показать нечего.
            </p>
          </div>
        </section>
      </noscript>
    </main>

    <nav class="tabbar" id="tabbar" hidden aria-label="Разделы"></nav>

    <!-- Vendored UMD libraries: both must be classic scripts, so they land on window. -->
    <script src="./vendor/tweetnacl.js"></script>
    <!-- Telegram's Mini App SDK. It is harmless in a normal browser: it just finds no
         initData and reports itself as not inside Telegram. -->
    <script src="./vendor/telegram-web-app.js"></script>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
